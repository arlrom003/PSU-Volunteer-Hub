{% extends 'layouts/role_base.html' %}
{% block title %}University Activity Calendar · PSU Volunteer Hub{% endblock %}
{% block content %}
<header class="page-heading"><div><h1>University Activity Calendar</h1><p>Read-only schedule across PSU campuses.</p></div><a class="btn btn--outline" href="{{ url_for('director.analytics') }}">Analytics</a></header>
<section class="panel">
  <form class="filter-row" method="get">
    <input type="hidden" name="year" value="{{ calendar_year }}"><input type="hidden" name="month" value="{{ calendar_number }}">
    <label class="field">Campus<select class="select" name="campus_id"><option value="">All Campuses</option>{% for campus in campuses %}<option value="{{ campus.id }}"{{ ' selected' if selected_campus == campus.id }}>{{ campus.name }}</option>{% endfor %}</select></label>
    <label class="field">Category<select class="select" name="category"><option value="">All Categories</option>{% for category in categories %}<option value="{{ category }}"{{ ' selected' if selected_category == category }}>{{ category }}</option>{% endfor %}</select></label>
    <button class="btn btn--primary" type="submit">Apply Filters</button>
  </form>
  {% include 'partials/campus_calendar.html' %}
</section>
{% endblock %}
