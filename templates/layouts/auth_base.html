<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>{% block title %}Account · PSU Volunteer Hub{% endblock %}</title>
    <meta name="theme-color" content="#f9f9ff">
    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/PSU-logo.png') }}"
      type="image/png"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    >
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/base.css') }}"
    >
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/auth.css') }}"
    >
  </head>
  <body class="auth-page">
    <a class="auth-skip-link" href="#main-content">Skip to main content</a>
    <nav class="auth-nav" aria-label="Account navigation">
      <a class="auth-nav__brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='assets/PSU-logo.png') }}" alt="" width="40" height="40">
        <span>PSU Volunteer Hub</span>
      </a>
      <div class="auth-nav__links">
        <a class="button button--secondary auth-nav__link" href="{{ url_for('home') }}">Home</a>
        <a class="button button--secondary auth-nav__link" href="{{ url_for('help_page') }}">Help</a>
      </div>
    </nav>
    {% include 'partials/flash_messages.html' %}
    {% block body %}{% endblock %}
    {% include 'partials/csrf_forms_script.html' %}
    <script src="{{ url_for('static', filename='scripts/form-submit-state.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/auth-forms.js') }}"></script>
    {% block scripts %}{% endblock %}
    {% include 'partials/session_idle.html' %}
  </body>
</html>
