<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PSU Volunteer Hub{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/PSU-logo.png') }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/errors.css') }}">
  </head>
  <body class="error-page">
    <a class="error-skip" href="#main-content">Skip to main content</a>
    <header class="error-brand"><a href="{{ home_url }}"><img src="{{ url_for('static', filename='assets/PSU-logo.png') }}" width="48" height="48" alt="Pangasinan State University"><span>PSU Volunteer Hub</span></a></header>
    <main id="main-content" class="error-content">{% block content %}{% endblock %}</main>
    <footer class="error-footer">Pangasinan State University</footer>
  </body>
</html>
