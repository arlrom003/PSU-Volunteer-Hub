{% extends 'layouts/error_base.html' %}
{% block title %}{{ code }} · {{ title }} · PSU Volunteer Hub{% endblock %}
{% block content %}
  <p class="error-code" aria-label="Error {{ code }}">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="error-message">{{ message }}</p>
  <nav class="error-actions" aria-label="Recovery options">
    <a class="btn btn--primary" href="{{ home_url }}">Return home</a>
    {% if code != 500 %}<a class="btn btn--outline" href="{{ signin_url }}">Sign in</a>{% endif %}
  </nav>
{% endblock %}
